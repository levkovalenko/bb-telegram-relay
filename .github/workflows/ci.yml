name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build & test (bb ${{ matrix.bb }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24"]
        bb: ["0.49.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install BB CLI
        run: npm install --global bb-app@${{ matrix.bb }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build the plugin
        run: bb plugin build .

      - name: Run tests
        run: npm test
